# ─────────────────────────────────────────────────────────────────────────────
#  CI: تست‌های خودکار RefrallBot
#
#  ⚠️ این فایل عمداً در مسیر .github/workflows/ قرار ندارد.
#  دلیل: توکن GitHub مورد استفاده در این محیط مجوز «workflows» ندارد و
#  ایجاد/به‌روزرسانی فایل‌های workflow را رد می‌کند.
#
#  برای فعال‌سازی روی GitHub:
#      mkdir -p .github/workflows
#      git mv .github/tests-workflow.yml .github/workflows/tests.yml
#      git commit -m "ci: فعال‌سازی تست‌های خودکار" && git push
#
#  (یا از رابط وب GitHub فایل را به .github/workflows/tests.yml منتقل کنید)
# ─────────────────────────────────────────────────────────────────────────────

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} — تست‌های خودکار
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, openssl, curl, json
          coverage: none

      - name: نمایش نسخه PHP
        run: php -v

      - name: بررسی سینتکس همه فایل‌های PHP
        run: |
          set -e
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || { echo "Syntax error in $file"; php -l "$file"; exit 1; }
            count=$((count + 1))
          done < <(find src views database bin config tests public -name '*.php' -print0)
          echo "✔ سینتکس $count فایل PHP سالم است"

      - name: اجرای تست‌ها (۱۰ سناریو)
        env:
          RB_TEST_FRESH: "1"
          RB_TEST_RUN_ID: ${{ github.run_id }}-${{ matrix.php }}
        run: |
          php tests/run_all.php | tee /tmp/test-output.txt
          grep -q "همه تست‌ها موفق" /tmp/test-output.txt

      - name: خلاصه نتایج در GitHub
        if: always()
        run: |
          {
            echo "### نتیجه تست‌ها (PHP ${{ matrix.php }})"
            echo '```'
            tail -20 /tmp/test-output.txt || echo "بدون خروجی"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  http-smoke:
    name: تست دود HTTP روی سرور واقعی PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, openssl, curl, json
          coverage: none

      - name: آماده‌سازی دیتابیس و داده اولیه
        env:
          DB_DRIVER: sqlite
          DB_DATABASE: /tmp/refrallbot-http.sqlite
        run: php tests/_seed_http.php

      - name: راه‌اندازی سرور و بررسی مسیرها
        env:
          DB_DRIVER: sqlite
          DB_DATABASE: /tmp/refrallbot-http.sqlite
          APP_DEBUG: "1"
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 -t public public/index.php > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8099/healthz; then break; fi
            sleep 1
          done

          check () {
            local path="$1" expect="$2"
            local code
            code=$(curl -s -o /tmp/body.html -w '%{http_code}' "http://127.0.0.1:8099${path}")
            echo "${path} → HTTP ${code} ($(wc -c < /tmp/body.html) bytes)"
            if [ "$code" != "$expect" ]; then
              echo "✘ انتظار HTTP ${expect} برای ${path}"
              cat /tmp/body.html | head -40
              echo "--- لاگ سرور ---"; tail -40 /tmp/server.log
              return 1
            fi
          }

          check /healthz 200
          grep -q '"ok":true' <(curl -s http://127.0.0.1:8099/healthz) || { echo "healthz پاسخ ok نداد"; exit 1; }

          check / 200
          check /install 200
          check /admin/login 200
          check /app 200
          check /webhook/telegram 200
          check /nope 404
          check /admin 302

          echo "--- استاتیک"
          CSS=$(curl -s -o /tmp/app.css -w '%{http_code}' http://127.0.0.1:8099/assets/css/app.css)
          echo "app.css → HTTP ${CSS}, $(wc -c < /tmp/app.css) bytes"
          [ "$CSS" = "200" ] || exit 1
          FONT=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/assets/fonts/Vazirmatn-Regular.woff2)
          echo "فونت وزیرمتن → HTTP ${FONT}"
          [ "$FONT" = "200" ] || exit 1

          echo "--- بررسی نبود خطای PHP در لاگ"
          if grep -qE 'PHP (Fatal|Parse) error' /tmp/server.log; then
            echo "✘ خطای PHP در لاگ سرور"; tail -40 /tmp/server.log; exit 1
          fi
          echo "✔ تست دود HTTP موفق"

      - name: نمایش لاگ سرور در صورت شکست
        if: failure()
        run: tail -100 /tmp/server.log || true

  security-scan:
    name: بررسی عدم وجود راز در مخزن
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: جستجوی توکن/کلید واقعی
        run: |
          set -e
          if [ -f .env ]; then echo "فایل .env نباید در مخزن باشد"; exit 1; fi
          # الگوی توکن ربات تلگرام: ۹ رقم + ':' + ۳۵ کاراکتر
          if grep -rEn '[0-9]{8,10}:[A-Za-z0-9_-]{35}' --include='*.php' --include='*.md' --include='*.yml' --include='*.json' . | grep -v 'AAAAAAAAA\|BBBBBBBBB\|XXXXX\|example\|placeholder'; then
            echo "توکن احتمالی ربات در مخزن یافت شد"
            exit 1
          fi
          echo "✔ هیچ راز واقعی در مخزن یافت نشد"
